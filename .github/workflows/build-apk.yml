name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 注意：故意不写 submodules: recursive。
      # third_party/ 下 10 个目录是 git submodule，在源码 zip 里是空目录；
      # 而 app/build.gradle.kts 里 CMake 已被注释禁用，native 库直接使用
      # app/src/main/jniLibs/arm64-v8a/ 里预编译的 40 个 .so，
      # 所以构建 APK 完全不需要这些 submodule。带上 recursive 反而会因拉取失败而中断。
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup JDK 21
  uses: actions/setup-java@v4
  with:
    distribution: temurin
    java-version: '21'

- name: Install SDK components
  run: |
    yes | sdkmanager --licenses || true
    sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

- name: Setup Gradle (cache)
  uses: gradle/actions/setup-gradle@v4
      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" > local.properties
          cat local.properties

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Dump build log on failure
        if: failure()
        run: |
          echo '=== test/build errors ==='
          tail -n 300 app/build/outputs/logs/manifest-merger-debug-report.txt 2>/dev/null || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xuanxingnihe-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/output-metadata.json
          if-no-files-found: error
          retention-days: 30
