name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          ndk-version: r27c

      - name: Install SDK components (with retry)
        run: |
          for i in {1..5}; do
            echo "🔄 尝试 $i/5 安装 SDK"
            yes | sdkmanager --licenses || true
            if sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"; then
              echo "✅ SDK 安装完成"
              exit 0
            fi
            echo "⚠️ 第 $i 次失败，10s 后重试"
            sleep 10
          done
          echo "❌ 5 次都失败"
          exit 1

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" > local.properties
          cat local.properties

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Dump build log on failure
        if: failure()
        run: |
          echo '=== test/build errors ==='
          tail -n 300 app/build/outputs/logs/manifest-merger-debug-report.txt 2>/dev/null || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xuanxingnihe-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/output-metadata.json
          if-no-files-found: error
          retention-days: 30
